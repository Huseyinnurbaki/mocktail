name: npm Publish CI

on:
  push:
    branches: [ master ]
    paths:
      - 'mcp-server/**'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # need tags so `git describe` can resolve the latest release

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      working-directory: mcp-server
      run: npm ci

    # Version comes from the latest git tag + commits-since + sha (e.g. 4.0.0-3-ge056b5f),
    # not the (often stale) package.json — so the dev channel auto-tracks the latest release.
    # --long always includes the sha suffix, so it can never collide with a real published version.
    - name: Publish dev snapshot
      working-directory: mcp-server
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        VERSION=$(git describe --tags --long --always | sed 's/^v//')
        echo "Publishing mocktail-mcp@${VERSION} (dev)"
        npm version "$VERSION" --no-git-tag-version --allow-same-version
        npm publish --tag dev
