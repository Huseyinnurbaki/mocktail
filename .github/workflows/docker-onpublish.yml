name: Docker Image OnTag CI

# Fires on the version-tag push itself — NOT `release: published`. GoReleaser publishes the
# GitHub release with the default GITHUB_TOKEN, and GitHub suppresses downstream workflow runs
# triggered by GITHUB_TOKEN events, so a `release: published` trigger here never runs.
on:
  push:
    tags: ['v*']
  # Manual re-run: pick a tag in "Use workflow from", or pass `tag` explicitly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v4.0.0 (defaults to the ref you run from)'
        required: false
        type: string

env:
  IMAGE_NAME: hhaluk/mocktail

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: hhaluk
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compute tags from git tag
      id: meta
      run: |
        REF="${{ github.event.inputs.tag }}"
        [ -z "$REF" ] && REF="${GITHUB_REF#refs/tags/}"
        VERSION="${REF#v}"
        TAGS="${IMAGE_NAME}:${VERSION}"
        # Only move :latest for stable releases — a pre-release (e.g. 4.1.0-rc.1) publishes
        # its own version tag but must not overwrite latest.
        if [[ "$VERSION" != *-* ]]; then
          TAGS="${TAGS},${IMAGE_NAME}:latest"
        fi
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

    - name: Build and push release
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
